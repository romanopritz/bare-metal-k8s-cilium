; Bare-metal Kubernetes inventory template.
; Copy this to inventory.ini and replace ansible_host values with your
; actual SSH targets. You can either:
;
;   1. Put real IPs/hostnames in ansible_host below, OR
;   2. Drop the ansible_host columns entirely and configure SSH host
;      aliases in ~/.ssh/config (Host cp1 ... HostName 1.2.3.4 ...).
;
; node_ip and node_name are NOT set here; the common role discovers them
; from facts at runtime (ansible_default_ipv4.address and
; inventory_hostname). This keeps real IPs out of the repo.

[controlplane]
cp1 ansible_host=cp1.your-domain.example
cp2 ansible_host=cp2.your-domain.example
cp3 ansible_host=cp3.your-domain.example

[workers]
worker1 ansible_host=worker1.your-domain.example
worker2 ansible_host=worker2.your-domain.example

[cluster:children]
controlplane
workers

[cluster:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
