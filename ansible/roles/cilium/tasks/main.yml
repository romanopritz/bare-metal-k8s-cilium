---
# Installs Cilium via Helm from the first control-plane node.
# Idempotent: re-running upgrades in place.

- name: Install helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: helm_install
  failed_when: false

- name: Fallback - install helm from upstream script when no apt package
  when: helm_install is failed or 'helm' not in (ansible_facts.packages | default({}))
  block:
    - name: Check if helm is already installed
      ansible.builtin.command: helm version --short
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Download upstream helm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /usr/local/bin/get-helm-3
        mode: "0755"
      when: helm_check.rc != 0

    - name: Run helm installer
      ansible.builtin.command: /usr/local/bin/get-helm-3
      when: helm_check.rc != 0
      changed_when: true

- name: Ensure /root/.config/helm exists
  ansible.builtin.file:
    path: /root/.config/helm
    state: directory
    mode: "0755"

- name: Add cilium helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: "{{ cilium_helm_repo }}"

- name: Copy cilium values to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../manifests/cilium/values.yaml"
    dest: /etc/kubernetes/cilium-values.yaml
    mode: "0644"

- name: Install / upgrade Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: false
    values_files:
      - /etc/kubernetes/cilium-values.yaml
    wait: true
    wait_timeout: 10m
    kubeconfig: /etc/kubernetes/admin.conf

- name: Wait for Cilium DaemonSet to be Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
      -n {{ cilium_namespace }}
      rollout status ds/cilium --timeout=5m
  changed_when: false
