---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key (provides containerd.io)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: true

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Hold containerd at this version
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Render default containerd config (the Docker package ships one with disabled_plugins=cri)
  ansible.builtin.shell: |
    set -o pipefail
    containerd config default > /etc/containerd/config.toml.new
    if ! cmp -s /etc/containerd/config.toml /etc/containerd/config.toml.new 2>/dev/null; then
      mv /etc/containerd/config.toml.new /etc/containerd/config.toml
      echo CHANGED
    else
      rm -f /etc/containerd/config.toml.new
    fi
  args:
    executable: /bin/bash
  register: containerd_config_render
  changed_when: "'CHANGED' in containerd_config_render.stdout"
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup\s*=\s*false'
    replace: '\1SystemdCgroup = true'
  notify: Restart containerd

- name: Pin pause image to the one kubeadm expects
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'sandbox_image\s*=\s*"registry.k8s.io/pause:[^"]+"'
    replace: 'sandbox_image = "registry.k8s.io/pause:3.10"'
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
